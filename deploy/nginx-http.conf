# Сгенерировано деплоем Балесноландии. Правки вручную перезапишутся при следующем деплое.
# Этап 1: только HTTP — для выпуска сертификата Let's Encrypt.
server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 503; }
}
