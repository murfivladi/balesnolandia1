# /etc/nginx/sites-available/api.vladinc.ru — API Балесноландии за nginx.
# Сертификат: certbot --nginx -d api.vladinc.ru
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name api.vladinc.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.vladinc.ru;

  ssl_certificate     /etc/letsencrypt/live/api.vladinc.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.vladinc.ru/privkey.pem;

  client_max_body_size 100m;   # импорт JSON из админки

  location /ws {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
