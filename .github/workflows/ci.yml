name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bln_test
          MARIADB_USER: bln
          MARIADB_PASSWORD: bln
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Тесты подготовки проекта Cloudflare Pages
        run: node --test .github/scripts/cloudflare-pages/ensure-project.test.mjs
      - name: Тесты (shared + web на jsdom, API на MariaDB)
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: bln
          DB_PASSWORD: bln
          TEST_DB_NAME: bln_test
      - run: npm run build
