name: Deploy

# push в main → тесты → сборка → FTP: сайт и API на хостинг (Vladhost).
# На сервере ничего не запускается: API при старте сам применяет миграции,
# а после загрузки новой версии сам перезапускается.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bln_test
          MARIADB_USER: bln
          MARIADB_PASSWORD: bln
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: bln
          DB_PASSWORD: bln
          TEST_DB_NAME: bln_test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'balesnolandia.vladislavb.ru' }}
      API_DOMAIN: ${{ vars.API_DOMAIN || 'api.balesnolandia.vladislavb.ru' }}
      # Vladhost: FTPS (явный TLS). Если сертификат FTP-сервера не проходит проверку — переменная FTP_SECURITY=loose.
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
      FTP_SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Проверка секретов
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_API_HOST: ${{ secrets.FTP_API_HOST }}
          FTP_API_USER: ${{ secrets.FTP_API_USER }}
          FTP_API_PASSWORD: ${{ secrets.FTP_API_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=""
          for k in FTP_HOST FTP_USER FTP_PASSWORD FTP_API_HOST FTP_API_USER FTP_API_PASSWORD DB_NAME DB_PASSWORD; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Сборка сайта
        run: npm run build -w web
        env:
          VITE_API_URL: https://${{ env.API_DOMAIN }}
          VITE_WS_URL: wss://${{ env.API_DOMAIN }}/ws

      - name: Сборка API (один файл server.mjs + миграции + bln.env)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          npm run build -w api
          # Настройки для первого запуска; остальное (почта, адреса) — в админке.
          # PORT не пишем: его передаёт панель хостинга.
          {
            echo "NODE_ENV=production"
            echo "DB_HOST=${DB_HOST:-127.0.0.1}"
            echo "DB_PORT=${DB_PORT:-3306}"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=${DB_USER:-$DB_NAME}"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "ADMIN_EMAILS=$ADMIN_EMAILS"
            echo "PUBLIC_WEB_URL=https://$SITE_DOMAIN"
            echo "CORS_ORIGINS=https://$SITE_DOMAIN"
          } > api/dist/bln.env
          # Метка версии выкладывается последней — по ней API понимает, что пора перезапуститься.
          mkdir -p release-version
          echo "$GITHUB_SHA" > release-version/VERSION

      - name: Сайт → FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT || 21 }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          security: ${{ env.FTP_SECURITY }}
          local-dir: ./web/dist/
          server-dir: ${{ secrets.FTP_DIR || './' }}

      - name: API → FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_API_HOST }}
          port: ${{ secrets.FTP_API_PORT || 21 }}
          username: ${{ secrets.FTP_API_USER }}
          password: ${{ secrets.FTP_API_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          security: ${{ env.FTP_SECURITY }}
          local-dir: ./api/dist/
          server-dir: ${{ secrets.FTP_API_DIR || './' }}

      - name: API → FTP (метка версии)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_API_HOST }}
          port: ${{ secrets.FTP_API_PORT || 21 }}
          username: ${{ secrets.FTP_API_USER }}
          password: ${{ secrets.FTP_API_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          security: ${{ env.FTP_SECURITY }}
          local-dir: ./release-version/
          server-dir: ${{ secrets.FTP_API_DIR || './' }}
          state-name: .ftp-deploy-version.json

      - name: Проверка API и сайта
        run: |
          for i in $(seq 1 24); do
            v=$(curl -fsS "https://$API_DOMAIN/api/health" 2>/dev/null | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$v" = "$GITHUB_SHA" ]; then echo "API работает, версия $v"; break; fi
            sleep 5
          done
          if [ "$v" != "$GITHUB_SHA" ]; then
            echo "::error::API на https://$API_DOMAIN не отвечает новой версией (сейчас: ${v:-нет ответа})."
            echo "Проверьте в панели сайта $API_DOMAIN вкладку «Среда»: Node.js, команда запуска «node server.mjs», журнал приложения."
            exit 1
          fi
          curl -fsS -o /dev/null "https://$SITE_DOMAIN/" && echo "Сайт открывается: https://$SITE_DOMAIN"
