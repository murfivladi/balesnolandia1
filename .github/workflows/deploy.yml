name: Deploy

# push в main → тесты → сборка фронтенда → FTP на shared hosting → API на VPS → миграции → pm2 reload
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bln_test
          MARIADB_USER: bln
          MARIADB_PASSWORD: bln
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: bln
          DB_PASSWORD: bln
          TEST_DB_NAME: bln_test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Сборка фронтенда
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_WS_URL: ${{ secrets.WS_URL }}

      - name: Фронтенд → shared hosting (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./web/dist/
          server-dir: ${{ secrets.FTP_DIR }}

      - name: SSH-ключ
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: API → VPS
        run: |
          rsync -azR --delete --exclude node_modules --exclude .env \
            -e "ssh -i ~/.ssh/deploy_key" \
            package.json package-lock.json ecosystem.config.cjs api/ shared/ web/package.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/"

      - name: Зависимости, миграции, перезапуск
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -se <<EOF
          set -euo pipefail
          cd "${{ secrets.VPS_APP_DIR }}"
          npm ci --omit=dev --workspace api --include-workspace-root=false --no-audit --no-fund
          npm run migrate --workspace api
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          EOF

      - name: Проверка API
        run: curl -fsS "${{ secrets.API_URL }}/api/health"
