name: Deploy

# push в main → тесты → сборка фронтенда → FTP на shared hosting → API на VPS → миграции → pm2 reload
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bln_test
          MARIADB_USER: bln
          MARIADB_PASSWORD: bln
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: bln
          DB_PASSWORD: bln
          TEST_DB_NAME: bln_test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      # Обязательные секреты: FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_DIR, VPS_HOST, VPS_USER, VPS_SSH_KEY.
      # Остальное — со значениями по умолчанию; адреса сайта и почта настраиваются в админке.
      API_DOMAIN: ${{ vars.API_DOMAIN || 'bln-api.vladinc.ru' }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/srv/balesnolandia' }}
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Адреса API
        run: |
          echo "API_URL=${{ secrets.API_URL }}" >> "$GITHUB_ENV"
          echo "WS_URL=${{ secrets.WS_URL }}" >> "$GITHUB_ENV"
          [ -n "${{ secrets.API_URL }}" ] || echo "API_URL=https://$API_DOMAIN" >> "$GITHUB_ENV"
          [ -n "${{ secrets.WS_URL }}" ] || echo "WS_URL=wss://$API_DOMAIN/ws" >> "$GITHUB_ENV"

      - name: Сборка фронтенда
        run: VITE_API_URL="$API_URL" VITE_WS_URL="$WS_URL" npm run build

      - name: Фронтенд → shared hosting (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./web/dist/
          server-dir: ${{ secrets.FTP_DIR }}

      - name: SSH-ключ
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes $SSH_TARGET" >> "$GITHUB_ENV"

      - name: Код API → VPS
        run: |
          $SSH "set -e; S=''; [ \"\$(id -u)\" = 0 ] || S='sudo -n'; \$S mkdir -p '$APP_DIR'; \$S chown \"\$(id -un)\": '$APP_DIR'; \
                cd '$APP_DIR' && rm -rf api/src api/scripts api/test shared deploy"
          tar czf - --exclude='api/.env' --exclude='node_modules' \
              package.json package-lock.json ecosystem.config.cjs api shared deploy web/package.json \
            | $SSH "tar xzf - -C '$APP_DIR'"

      - name: Сервер — nginx, сертификат, база, .env
        run: |
          $SSH "S=''; [ \"\$(id -u)\" = 0 ] || S='sudo -n'; \$S env \
            DOMAIN='$API_DOMAIN' APP_DIR='$APP_DIR' APP_USER=\"\$(id -un)\" \
            ADMIN_EMAILS='${{ secrets.ADMIN_EMAILS }}' CERTBOT_EMAIL='${{ secrets.CERTBOT_EMAIL }}' \
            bash '$APP_DIR/deploy/setup-server.sh'"

      - name: Зависимости, миграции, перезапуск
        run: |
          $SSH bash -se <<EOF
          set -euo pipefail
          cd "$APP_DIR"
          npm ci --omit=dev --workspace api --include-workspace-root=false --no-audit --no-fund
          npm run migrate --workspace api
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          EOF

      - name: Проверка API
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS "$API_URL/api/health" && exit 0; sleep 5; done
          echo "API не отвечает по $API_URL" && exit 1
