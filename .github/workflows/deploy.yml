name: Deploy

# push в main → тесты → сборка фронтенда → FTP на shared hosting → API на VPS → миграции → pm2 reload
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bln_test
          MARIADB_USER: bln
          MARIADB_PASSWORD: bln
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: bln
          DB_PASSWORD: bln
          TEST_DB_NAME: bln_test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      # Обязательные секреты: FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_DIR, VPS_HOST, VPS_USER и VPS_PASS (или VPS_SSH_KEY).
      # Остальное — со значениями по умолчанию; адреса сайта и почта настраиваются в админке.
      API_DOMAIN: ${{ vars.API_DOMAIN || 'bln-api.vladinc.ru' }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/srv/balesnolandia' }}
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      # Пароль VPS: вход по SSH (если нет VPS_SSH_KEY) и sudo (если VPS_USER не root)
      SSHPASS: ${{ secrets.VPS_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Адреса API
        run: |
          echo "API_URL=${{ secrets.API_URL }}" >> "$GITHUB_ENV"
          echo "WS_URL=${{ secrets.WS_URL }}" >> "$GITHUB_ENV"
          [ -n "${{ secrets.API_URL }}" ] || echo "API_URL=https://$API_DOMAIN" >> "$GITHUB_ENV"
          [ -n "${{ secrets.WS_URL }}" ] || echo "WS_URL=wss://$API_DOMAIN/ws" >> "$GITHUB_ENV"

      - name: Сборка фронтенда
        run: VITE_API_URL="$API_URL" VITE_WS_URL="$WS_URL" npm run build

      - name: Фронтенд → shared hosting (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./web/dist/
          server-dir: ${{ secrets.FTP_DIR }}

      - name: Доступ к VPS (ключ или пароль)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "SSH=ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes $SSH_TARGET" >> "$GITHUB_ENV"
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "SSH=sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no $SSH_TARGET" >> "$GITHUB_ENV"
          else
            echo "Задайте секрет VPS_PASS (пароль) или VPS_SSH_KEY (ключ)"; exit 1
          fi

      - name: Проверка входа на VPS
        run: |
          $SSH 'echo "Вход на VPS: $(id -un)@$(hostname)"'

      - name: Код API → VPS
        run: |
          tar czf - --exclude='api/.env' --exclude='node_modules' \
              package.json package-lock.json ecosystem.config.cjs api shared deploy web/package.json \
            | $SSH 'rm -rf ~/.bln-release && mkdir -p ~/.bln-release && tar xzf - -C ~/.bln-release'

      - name: Сервер — nginx, сертификат, база, .env
        run: |
          printf '%s\n' "$SSHPASS" | $SSH "bash ~/.bln-release/deploy/as-root.sh env \
            RELEASE_DIR=\$HOME/.bln-release DOMAIN='$API_DOMAIN' APP_DIR='$APP_DIR' APP_USER=\$(id -un) \
            ADMIN_EMAILS='${{ secrets.ADMIN_EMAILS }}' CERTBOT_EMAIL='${{ secrets.CERTBOT_EMAIL }}' \
            bash \$HOME/.bln-release/deploy/setup-server.sh"

      - name: Зависимости, миграции, перезапуск
        run: |
          $SSH bash -se <<EOF
          set -euo pipefail
          cd "$APP_DIR"
          npm ci --omit=dev --workspace api --include-workspace-root=false --no-audit --no-fund
          npm run migrate --workspace api
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          EOF

      - name: Проверка API
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS "$API_URL/api/health" && exit 0; sleep 5; done
          echo "API не отвечает по $API_URL" && exit 1
